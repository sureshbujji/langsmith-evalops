name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Mock-mode smoke test (no API key, no network)
        env:
          LANGSMITH_API_KEY: ""   # force the offline EvalStore path
        run: |
          python -m src.run_experiment \
            --db-path /tmp/evalops-smoke.db \
            --report-path /tmp/smoke-regression-report.md \
            --dataset-name ci-smoke
          grep -q "REGRESSION DETECTED" /tmp/smoke-regression-report.md
